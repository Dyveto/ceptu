<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceptu Admin Platform</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f9; color: #333; display: flex; justify-content: center; min-height: 100vh; }
      #root { width: 100%; display: flex; justify-content: center; align-items: start; padding: 2rem; box-sizing: border-box; }
      .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; margin: 2rem auto; }
      .dashboard-container { max-width: 800px; width: 100%; margin: auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      input, button { display: block; width: 100%; margin: 0.75rem 0; padding: 0.5rem; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
      button { background: #0076ff; color: white; border: none; cursor: pointer; font-weight: bold; }
      button:hover { background: #0056b3; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
      th { background-color: #f8f9fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
